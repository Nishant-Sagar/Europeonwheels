services:
  - type: web
    name: europe-on-wheels-api
    runtime: python
    rootDir: backend
    plan: free
    pythonVersion: "3.11.0"
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && find . -name '__pycache__' -exec rm -rf {} + || true
    startCommand: PYTHONDONTWRITEBYTECODE=1 uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # All set in the Render dashboard, never in this file.
      - key: FRONTEND_ORIGINS
        sync: false
      # Notification delivery. Without these a lead has nowhere to go and the
      # API now returns 503 rather than pretending the enquiry was received.
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFY_EMAIL
        sync: false
      - key: WHATSAPP_PHONE
        sync: false
      - key: GREEN_API_INSTANCE
        sync: false
      - key: GREEN_API_TOKEN
        sync: false
      # Bearer token for GET /api/enquiries/. Unset = the endpoint stays closed.
      - key: ADMIN_TOKEN
        sync: false
